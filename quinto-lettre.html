<style>
body{font-family:"Century Gothic",sans-serif;background:#fff;text-align:center;margin:0}

/* Clavier NOIR / BLANC */
body.clavier-noir .key{background:#000;color:#fff;border-color:#000}
body.clavier-blanc .key{background:#fff;color:#000;border-color:#555}

/* Clavier couleur par grille */
.key.vert{background:#00a000;color:#fff;border-color:#007700}
.key.bleu{background:#003eff;color:#fff;border-color:#0028aa}
.key.rouge{background:#cc0000;color:#fff;border-color:#880000}
.key.noir{background:#000;color:#fff;border-color:#000}

h1{font-size:38px;margin:20px 0 10px}
.legend{font-style:italic}
.legend a{cursor:pointer;text-decoration:none;color:inherit}
.legend a:hover{text-decoration:underline}

.levels{display:flex;justify-content:center;gap:12px;margin:8px 0}
.level{width:36px;height:36px;border:2px solid #000;cursor:pointer}
.green{background:#00c000}
.blue{background:#0066ff}
.red{background:#e00000}
.black{background:#000}

#grid-wrapper{display:inline-block;padding:18px}
#grid-wrapper.vert{background:#00a000}
#grid-wrapper.bleu{background:#003eff}
#grid-wrapper.rouge{background:#cc0000}
#grid-wrapper.noir{background:#000}

#grid{
  display:grid;
  grid-template-columns:repeat(5,70px);
  grid-template-rows:repeat(5,70px);
}
.cell.block{
  background:black !important;
}

.cell{
  border:1px solid #333;
  font-family:"Century Schoolbook",serif;
  font-size:46px;
  font-weight:600;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none
}
.cell.vert{background:#e6f7e6;color:#006600}
.cell.bleu{background:#e6f0ff;color:#0033cc}
.cell.rouge{background:#ffe6e6;color:#990000}
.cell.noir{background:#fff;color:#000}
.cell.blanc{background:#fff!important}
.cell.selected{outline:3px solid #888}

#voyelles{margin:14px 0 10px}
#consonnes{margin:10px 0 18px}
.keyboard-row{display:flex;justify-content:center;margin:6px}
.key{
  width:40px;height:40px;margin:4px;
  border:2px solid currentColor;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:20px;border-radius:6px
}
.cell.vert.block{background:#00a000 !important;}
.cell.bleu.block{background:#003eff !important;}
.cell.rouge.block{background:#cc0000 !important;}
.cell.noir.block{background:#000 !important;}
.actions{margin:12px}
.actions button{
  padding:6px 16px;border:2px solid #555;
  background:#eee;cursor:pointer
}

#modalBg{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  display:none;z-index:1000
}
#modalBox{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:#fff;border-radius:20px;
  padding:26px 30px;max-width:560px;
  pointer-events:none;text-align:center
}
#modalBox.vert{border:4px solid #00a000;color:#006600}
#modalBox.bleu{border:4px solid #003eff;color:#0033cc}
#modalBox.rouge{border:4px solid #cc0000;color:#990000}
#modalBox.noir{border:4px solid #000;color:#000}

/* ===== ONGLET COMMENT JOUER ===== */
.help-box{
  display:inline-block;
  margin:12px auto 8px;
  padding:8px 16px;
  border:2px dashed #666;
  background:#ffffff;
  font-style:italic;
  cursor:pointer;
}
.help-box:hover{
  background:#f5f5f5;
}
.help-container{
  display:flex;
  justify-content:center;
  gap:10px;
}
</style>
</head>

/* ================= ÉTAT (4 PARTIES INDÉPENDANTES) ================= */
const STATES = {
  VERT:  { grid:Array(25).fill(""), touched:Array(25).fill(false), started:false },
  BLEU:  { grid:Array(25).fill(""), touched:Array(25).fill(false), started:false },
  ROUGE: { grid:Array(25).fill(""), touched:Array(25).fill(false), started:false },
  NOIR:  { grid:Array(25).fill(""), touched:Array(25).fill(false), started:false }
};

let selected=null;
let LVL="VERT";

function S(){ return STATES[LVL]; }          // state courant
function G(){ return STATES[LVL].grid; }     // grille courante
function T(){ return STATES[LVL].touched; }  // touched courant
const SCORES = {
  VERT: 0,
  BLEU: 0,
  ROUGE: 0,
  NOIR: 0
};
/* ================= GRILLE ================= */
function initGrid(){
  gridDiv.innerHTML="";
  for(let i=0;i<25;i++){
    const c=document.createElement("div");
    c.className="cell";
    c.onclick=()=>cellClick(i);
    gridDiv.appendChild(c);
  }
}
function refresh(){
  document.querySelectorAll(".cell").forEach((c,i)=>{

    // reset propre
    c.className = "cell " + LVL.toLowerCase();

    // contenu
    c.textContent = G()[i];

    // case bloquée
    if(G()[i]==="■"){
      c.textContent="";
      c.classList.add("block");
    }
 if(T()[i] && G()[i]!=="■"){
      c.classList.add("blanc");
    }
  
    // sélection
    if(selected===i){
      c.classList.add("selected");
    }
  });
}
function cellClick(i){
  if(G()[i]){
    G()[i]="";
    T()[i]=true;
    selected=null;
  } else {
    selected=i;
  }
  refresh();
}
/* ================= CLAVIERS ================= */
function key(L){
  const k=document.createElement("div");
  k.className="key "+LVL.toLowerCase();
  k.textContent=L;
  k.onclick=()=>{
    if(selected!==null){
      G()[selected]=L;
      T()[selected]=true;
      selected=null;
      refresh();
    }
  };
  return k;
}

/* ================= CLAVIER PC ================= */

 document.addEventListener("keydown", e => {

  if(selected === null) return;

  const k = e.key.toUpperCase();

  // 🔤 Lettres A → Z
  if(k >= "A" && k <= "Z"){
    G()[selected] = k;
    T()[selected] = true;
    selected = null;
    refresh();
    e.preventDefault();
  }

  // ⬛ Carré (plusieurs touches possibles)
  if(k === " " || k === "." || k === "#" || k === "*"){
    G()[selected] = "■";
    T()[selected] = true;
    selected = null;
    refresh();
    e.preventDefault();
  }

  // ⌫ Effacer
  if(e.key === "Backspace" || e.key === "Delete"){
    G()[selected] = "";
    T()[selected] = true;
    selected = null;
    refresh();
    e.preventDefault();
  }
});

function randomVowelFor(state){
  const v="AEIOU";
  const p=Math.floor(Math.random()*25);
  state.grid[p]=v[Math.floor(Math.random()*v.length)];
  state.touched[p]=true;
}
function randomVowel(){
  randomVowelFor(S());
}

function setKeyboard(m){
  document.body.classList.remove("clavier-noir","clavier-blanc");
  document.body.classList.add(m==="noir"?"clavier-noir":"clavier-blanc");
}
function setKeyboardAuto(){document.body.classList.remove("clavier-noir","clavier-blanc")}

/* ✅ CORRECTION PRINCIPALE :
   setLvl() = NAVIGATION UNIQUEMENT
   (plus de grid.fill / touched.fill / randomVowel ici)
*/
function setLvl(l){
  LVL=l;
  selected=null;

  gridWrapper.className=l.toLowerCase();
  setKeyboardAuto();
  initKeyboards();

  // Si c'est la première fois qu'on va sur cette couleur : on initialise UNE fois
  if(!S().started){
    S().grid.fill("");
    S().touched.fill(false);
    randomVowelFor(S());
    S().started=true;
  }

  refresh();
}

/* ✅ NOUVELLE PARTIE = RESET LOCAL (couleur courante uniquement) */
function nouvelle(){
  S().grid.fill("");
  S().touched.fill(false);
  selected=null;

  SCORES[LVL] = 0; // ← RESET SCORE DE LA GRILLE COURANTE

  randomVowelFor(S());
  S().started=true;
  refresh();
}
/* ================= VALIDATION ================= */
function scoreMot(m){
  if(m.length < 2) return 0;
  return m.length;
}

function valider(){
  if(G().some(x=>!x)){
    showModal("<h2>✗ Grille non valide</h2>Grille incomplète.");
    return;
  }

  const nomCouleur = {
    VERT: "verte",
    BLEU: "bleue",
    ROUGE: "rouge",
    NOIR: "noire"
  };

  const rows=[
    G().slice(0,5).join(""),
    G().slice(5,10).join(""),
    G().slice(10,15).join(""),
    G().slice(15,20).join(""),
    G().slice(20,25).join("")
  ];

  const cols=[
    G()[0]+G()[5]+G()[10]+G()[15]+G()[20],
    G()[1]+G()[6]+G()[11]+G()[16]+G()[21],
    G()[2]+G()[7]+G()[12]+G()[17]+G()[22],
    G()[3]+G()[8]+G()[13]+G()[18]+G()[23],
    G()[4]+G()[9]+G()[14]+G()[19]+G()[24]
  ];

  let total = 0;
  let ok = true;

  [...rows, ...cols].forEach(w=>{
    const parts = w.split("■");

    parts.forEach(part=>{
      if(part.length < 2) return;

      let valid = false;

      if(part.length === 5) valid = WORDS5.has(part);
      else if(part.length === 4) valid = WORDS4.has(part);
      else if(part.length === 3) valid = WORDS3.has(part);
      else if(part.length === 2) valid = WORDS2.has(part);

      if(valid){
        total += scoreMot(part);
      } else {
        ok = false;
      }
    });
  });

  if(ok){
    total += 50; // bonus QUINTO

    SCORES[LVL] = total;

    const totalGlobal =
      SCORES.VERT +
      SCORES.BLEU +
      SCORES.ROUGE +
      SCORES.NOIR;

    showModal(`
      <h2>🎉 Bravo !</h2>
      Score grille ${nomCouleur[LVL]} : ${total} points<br><br>

    `);
  } else {
    showModal("<h2>✗ Grille non valide</h2>Certains mots ne sont pas valides.");
  }
}

}
